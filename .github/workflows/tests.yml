name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2022"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest -q tests
      - name: Run installation smoke test
        run: python -m gueye

  scientific-validation:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          mkdir -p validation/results
      - name: Run 1D validation
        run: python validation/test_problem1d.py 2>&1 | tee validation/results/test_problem1d.txt
        shell: bash
      - name: Run 2D validation
        run: python validation/test_problem2d.py 2>&1 | tee validation/results/test_problem2d.txt
        shell: bash
      - name: Run 3D validation
        run: python validation/test_problem3d.py 2>&1 | tee validation/results/test_problem3d.txt
        shell: bash
      - name: Run absorbing-boundary and PML validation
        run: python validation/test_absorb.py 2>&1 | tee validation/results/test_absorb.txt
        shell: bash
      - name: Run time-domain validation
        run: python validation/test_wave1d.py 2>&1 | tee validation/results/test_wave1d.txt
        shell: bash
      - name: Run independent sparse-reference validation
        run: python validation/test_independent_references.py 2>&1 | tee validation/results/test_independent_references.txt
        shell: bash
      - name: Upload scientific validation logs
        uses: actions/upload-artifact@v4
        with:
          name: gueye-0.7.2-reviewer2-scientific-validation
          path: validation/results/*.txt
          if-no-files-found: error

  build-distributions:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build and manuscript tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Compile corrected SoftwareX manuscript
        working-directory: manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error gueye_softwarex_0.7.2_corrected.tex
          pdflatex -interaction=nonstopmode -halt-on-error gueye_softwarex_0.7.2_corrected.tex
          pages="$(pdfinfo gueye_softwarex_0.7.2_corrected.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 8
          pdftotext gueye_softwarex_0.7.2_corrected.pdf manuscript.txt
          grep -qi "Validation" manuscript.txt
          grep -qi "Limitations" manuscript.txt
          echo "Manuscript PDF: $pages pages; text checks passed."
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Verify distribution metadata and source contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          dist = Path("dist")
          wheels = list(dist.glob("gueye-0.7.2-*.whl"))
          sdists = list(dist.glob("gueye-0.7.2.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as z:
              metadata = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              text = z.read(metadata).decode("utf-8")
              assert "Name: gueye" in text and "Version: 0.7.2" in text
              assert "Requires-Python: >=3.9" in text
              assert any(n.endswith("gueye/api.py") for n in z.namelist())
          with tarfile.open(sdists[0], "r:gz") as t:
              names = t.getnames()
              assert any(n.endswith("manuscript/gueye_softwarex_0.7.2_corrected.pdf") for n in names)
              assert any(n.endswith("tests/test_api.py") for n in names)
              assert any(n.endswith("validation/benchmark_reproducible.py") for n in names)
              assert any(n.endswith("validation/test_independent_references.py") for n in names)
  assert any(n.endswith("RELEASE_NOTES_v0.7.2.md") for n in names)
  assert any(n.endswith("REVIEWER_RESPONSE_0.7.2.md") for n in names)
          print("Distribution metadata and source contents: OK")
          PY
      - name: Install built wheel and run smoke test
        run: |
          python -m pip install dist/gueye-0.7.2-*.whl
          python -m gueye
      - uses: actions/upload-artifact@v4
        with:
          name: gueye-0.7.2-submission-artifacts
          path: |
            dist/*
            manuscript/gueye_softwarex_0.7.2_corrected.pdf
            REVIEWER_RESPONSE_0.7.2.md
          if-no-files-found: error
