name: Zenodo deposit — GUEYE v0.7.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-zenodo-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare source archive
        env:
          TAG: v0.7.2
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${TAG}" \
            -o gueye-v0.7.2.zip
          test -s gueye-v0.7.2.zip

      - name: Create or resume Zenodo draft and upload archive
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}" || {
            echo "::error::The GitHub Actions secret ZENODO_TOKEN is missing."
            exit 1
          }

          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["ZENODO_TOKEN"]
          api = "https://zenodo.org/api/deposit/depositions"
          title = "gueye: semi-analytic inversion of discrete Laplace/Helmholtz operators in 1D–2D–3D"
          headers = {"Authorization": f"Bearer {token}"}

          def request_json(url, data=None, method=None, extra_headers=None):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              req = urllib.request.Request(
                  url,
                  data=(json.dumps(data).encode("utf-8") if data is not None else None),
                  headers=h,
                  method=method or ("POST" if data is not None else "GET"),
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  print("Zenodo API error:", exc.code, exc.read().decode("utf-8", "replace"))
                  sys.exit(1)

          # Reuse a previous draft if an earlier run created it but failed during upload.
          deposits = request_json(api)
          if isinstance(deposits, dict):
              deposits = deposits.get("hits", {}).get("hits", [])
          draft = next((
              item for item in deposits
              if not item.get("submitted")
              and item.get("metadata", {}).get("title") == title
              and item.get("metadata", {}).get("version") == "0.7.2"
          ), None)

          if draft:
              deposit = request_json(f"{api}/{draft['id']}")
              print(f"Resuming existing Zenodo draft {deposit['id']}.")
          else:
              metadata = {
                  "metadata": {
                      "title": title,
                      "upload_type": "software",
                      "description": (
                          "GUEYE v0.7.2 is an independent Python solver for finite-difference "
                          "Laplace and Helmholtz problems on rectangular grids in one, two and "
                          "three dimensions. This stable release corrects discrete resonance "
                          "calculations, including the mass parameter contribution; adds full "
                          "support for complex prescribed Dirichlet boundary data; and expands "
                          "regression and independent numerical validation. The 1D, 2D and 3D "
                          "implementations were verified against independently assembled sparse "
                          "reference systems. All 12 CI jobs passed on Ubuntu and Windows with "
                          "Python 3.9–3.13.\n\n"
                          "Source code: https://github.com/sbirag/gueye\n"
                          "Release: https://github.com/sbirag/gueye/releases/tag/v0.7.2"
                      ),
                      "creators": [{
                          "name": "Gueye, Serigne Bira",
                          "affiliation": "Department of Physics, Faculty of Sciences and Techniques, Cheikh Anta Diop University, Dakar, Senegal"
                      }],
                      "version": "0.7.2",
                      "publication_date": "2026-11-22",
                      "license": "mit",
                      "access_right": "open",
                      "keywords": [
                          "Laplace equation", "Helmholtz equation", "finite differences",
                          "semi-analytic solver", "scientific computing", "Python",
                          "Green function", "discrete resonances"
                      ],
                      "related_identifiers": [{
                          "identifier": "https://github.com/sbirag/gueye",
                          "relation": "isSupplementTo",
                          "scheme": "url"
                      }]
                  }
              }
              deposit = request_json(api, data=metadata)
              print(f"Created Zenodo draft {deposit['id']}.")

          deposit_id = deposit["id"]
          bucket = deposit["links"]["bucket"]
          archive = pathlib.Path("gueye-v0.7.2.zip")
          upload_request = urllib.request.Request(
              f"{bucket}/{urllib.parse.quote(archive.name)}",
              data=archive.read_bytes(),
              headers={
                  **headers,
                  "Content-Type": "application/octet-stream",
              },
              method="PUT",
          )
          try:
              with urllib.request.urlopen(upload_request) as response:
                  json.load(response)
          except urllib.error.HTTPError as exc:
              print("Zenodo file upload failed:", exc.code, exc.read().decode("utf-8", "replace"))
              sys.exit(1)

          print(f"SUCCESS: Zenodo draft {deposit_id} has the source archive.")
          print(f"Review and publish manually: https://zenodo.org/deposit/{deposit_id}")
          PY
